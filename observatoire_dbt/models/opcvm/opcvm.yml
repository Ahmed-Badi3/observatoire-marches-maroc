version: 2

models:
  - name: flux_opcvm_annuel
    description: "Flux net annuel (souscriptions − rachats) de chaque catégorie d'OPCVM, en MAD et en milliards (flux_net_md). 1re et dernière année partielles (nb_semaines)."
    columns:
      - name: categorie
        tests:
          - not_null
      - name: annee
        tests:
          - not_null
      - name: flux_net_md
        tests:
          - not_null
      - name: premiere_date
        description: "1re date de l'année prise en compte"
        tests:
          - not_null
      - name: derniere_date
        description: "Dernière date de l'année prise en compte"
        tests:
          - not_null
      - name: annee_partielle
        description: "Vrai si l'année n'est pas couverte en entier (macro annee_partielle)"
        tests:
          - not_null
