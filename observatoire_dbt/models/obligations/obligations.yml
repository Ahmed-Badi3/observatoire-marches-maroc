version: 2

models:
  - name: courbe_taux_quotidienne
    description: "Courbe des taux BAM interpolée à maturités fixes, une ligne par jour et par maturité"
    columns:
      - name: date_courbe
        tests:
          - not_null
      - name: maturite
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['13 sem', '1 an', '2 ans', '5 ans', '10 ans']
      - name: taux_pct
        tests:
          - not_null

  - name: obligations_vs_taux_hebdo
    description: "Rendement hebdomadaire des fonds Monétaire, Obligations CT et MLT face au niveau et à la variation des taux BAM"
    columns:
      - name: date_semaine
        tests:
          - not_null
      - name: categorie
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Monétaire', 'Obligations CT', 'Obligations MLT']
      - name: indice
        tests:
          - not_null

  - name: fonds_taux_annuel
    description: "Q1 : rendement annuel de chaque fonds de taux et variation du taux 10 ans sur l'année"
    columns:
      - name: categorie
        tests:
          - not_null
      - name: annee
        tests:
          - not_null
      - name: rendement_pct
        tests:
          - not_null
      - name: premiere_date
        description: "1re date de l'année prise en compte"
        tests:
          - not_null
      - name: derniere_date
        description: "Dernière date de l'année prise en compte"
        tests:
          - not_null
      - name: annee_partielle
        description: "Vrai si l'année n'est pas couverte en entier (macro annee_partielle)"
        tests:
          - not_null

  - name: sensibilite_fonds_taux
    description: "Q2 : sensibilité implicite (−pente de régression) des fonds de taux à la variation du taux 10 ans"
    columns:
      - name: periode
        tests:
          - not_null
      - name: categorie
        tests:
          - not_null

  - name: taux_autour_decisions_bam
    description: "Q3 : taux 13 semaines vs taux directeur à la veille de chaque décision BAM (anticipation du marché)"
    columns:
      - name: date_effet
        tests:
          - not_null
      - name: decision
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Hausse', 'Baisse', 'Maintien']

  - name: flux_fonds_taux_timing
    description: "Q4 : corrélation des flux nets hebdomadaires avec la performance et les taux passés (4 sem.) et futurs (4 sem.)"
    columns:
      - name: categorie
        tests:
          - not_null

  - name: flux_fonds_taux_annuel
    description: "Q4 : flux nets annuels des fonds de taux face au rendement et à la variation du taux 10 ans"
    columns:
      - name: categorie
        tests:
          - not_null
      - name: annee
        tests:
          - not_null
      - name: premiere_date
        description: "1re date de l'année prise en compte"
        tests:
          - not_null
      - name: derniere_date
        description: "Dernière date de l'année prise en compte"
        tests:
          - not_null
      - name: annee_partielle
        description: "Vrai si l'année n'est pas couverte en entier (macro annee_partielle)"
        tests:
          - not_null